      <button type="button" class="snd" id="snd" aria-pressed="false" data-i18n-aria="aria.sound"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path class="w" d="M15.5 9.5a3.5 3.5 0 010 5M18 7.5a6.5 6.5 0 010 9"/><path class="x" d="M16 10l4 4M20 10l-4 4"/></svg></button><span aria-hidden="true" class="snd-sep"></span>
      <button type="button" data-lang="zh" lang="zh-CN">中</button><span aria-hidden="true">/</span><button type="button" data-lang="en" lang="en">EN</button>
    </div>
    <button type="button" class="grav" id="grav" aria-pressed="false" data-i18n-aria="aria.grav" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">
        <rect x="7.2" y="3.2" width="9.6" height="17.6" rx="2.2" transform="rotate(-14 12 12)"/>
        <circle class="g-dot" cx="12" cy="15.6" r="1.5"/><path class="g-arc" d="M4.2 8.6c-.9 1.6-1.2 3.4-.8 5.2M19.8 15.4c.9-1.6 1.2-3.4.8-5.2"/>
      </svg>
    </button>
  </div>

  <section class="controls">
    <div class="colourways" role="radiogroup" data-i18n-aria="aria.colours"><div class="dots"></div><span class="cw-name" aria-hidden="true"></span></div>
    <div class="actions">
      <button id="reset" class="act" type="button" data-i18n="act.reset"></button>
      <button id="to-sea" class="act" type="button" data-i18n="egg.sea"></button>
    </div>
  </section>

  <p class="hint" id="hint"></p>
  <p class="colophon" id="colophon"></p>
  <button class="shroom off" id="shroom" type="button" data-i18n-aria="aria.egg">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.6 12.2C3.6 7.1 7.4 3.4 12 3.4s8.4 3.7 8.4 8.8c0 .5-.4.8-.9.8H4.5c-.5 0-.9-.3-.9-.8Z"/>
      <path d="M9.2 13v4.6c0 1.7 1.2 2.9 2.8 2.9s2.8-1.2 2.8-2.9V13"/>
      <circle cx="9" cy="8.4" r="1.15"/><circle cx="14.6" cy="6.9" r=".85"/><circle cx="15.6" cy="10.2" r=".7"/>
    </svg>
  </button>

  <div id="loader" class="loader">
    <div class="loader-inner">
      <p class="l-kicker" data-i18n="kicker"></p>
      <div class="bar"><i id="bar"></i></div>
      <p class="l-pct" id="pct">0</p>
    </div>
  </div>
  <div id="fail" class="fail" hidden><p class="fail-t" data-i18n="fail.title"></p><p class="fail-b" data-i18n="fail.body"></p></div>
</main>
</body>
</html>
