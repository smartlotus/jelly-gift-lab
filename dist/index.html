<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#cfcdc8" />
<meta name="format-detection" content="telephone=no" />
<title>Jelly Studies — No. 1 Great Hammerhead · 果冻标本</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%23111'/%3E%3C/svg%3E" />
  <script type="module" crossorigin src="./assets/index-CHGgGekf.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-_W6BQOBi.css">
</head>
<body>
<main id="stage">
  <canvas id="gl" aria-label="Interactive jelly hammerhead shark"></canvas>

  <header class="masthead">
    <div class="kicker"><span>Jelly Studies</span><span class="rule"></span><span class="num">No.&nbsp;1</span></div>
    <h1 class="title"><em>Great Hammerhead</em></h1>
    <p class="subtitle zh">果冻标本 · 无沟双髻鲨</p>
  </header>

  <nav class="characters" aria-label="Character">
    <button class="char active" data-char="shark" aria-pressed="true"><span class="en">Shark</span><span class="zh">鲨</span></button>
    <button class="char soon" data-char="pig" aria-disabled="true" title="Coming soon"><span class="en">Pig</span><span class="zh">猪</span><i>soon</i></button>
    <button class="char soon" data-char="cat" aria-disabled="true" title="Coming soon"><span class="en">Cat</span><span class="zh">猫</span><i>soon</i></button>
  </nav>

  <section class="readouts" aria-live="off">
    <div class="ro"><span class="lab">Mass <b class="zh">质量</b></span><span class="val"><span id="ro-mass">—</span><small>g</small></span></div>
    <div class="ro"><span class="lab">Volume <b class="zh">体积</b></span><span class="val"><span id="ro-vol">—</span><small>ml</small></span></div>
    <div class="ro"><span class="lab">Fork length <b class="zh">叉长</b></span><span class="val"><span id="ro-fork">—</span><small>cm</small></span></div>
    <div class="ro"><span class="lab">Eye to eye <b class="zh">眼距</b></span><span class="val"><span id="ro-eye">—</span><small>cm</small></span></div>
  </section>

  <section class="controls">
    <div class="colourways" role="radiogroup" aria-label="Colourway"></div>
    <div class="actions">
      <button id="bait" class="act"><span class="en">Drop bait</span><span class="zh">投饵</span></button>
      <button id="reset" class="act"><span class="en">Reset</span><span class="zh">复位</span></button>
    </div>
  </section>

  <p class="hint" id="hint"><span class="en">Drag to stretch · scroll or two fingers to twist</span><span class="zh">拖动拉伸 · 滚轮或双指扭转</span></p>
  <p class="colophon" id="colophon"></p>

  <div id="loader" class="loader">
    <div class="loader-inner">
      <p class="l-kicker">Jelly Studies</p>
      <p class="l-title"><em>Casting the jelly</em></p>
      <p class="l-zh zh">浇注果冻中</p>
      <div class="bar"><i id="bar"></i></div>
      <p class="l-pct" id="pct">0%</p>
    </div>
  </div>
  <div id="fail" class="fail" hidden><p><em>This study needs WebGL 2 or WebGPU.</em></p><p class="zh">当前浏览器不支持 WebGL2 / WebGPU，请换用新版浏览器打开。</p></div>
</main>
</body>
</html>
